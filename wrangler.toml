name = "leaf-garden-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# All persistent bot state lives here: user registration, per-player
# stats, and referral locks. Used to be split across this D1 database and
# a KV namespace — moved everything here for one less service to reason
# about, since KV's remaining job (referral locks) never actually needed
# KV specifically, just somewhere to persist a row.
[[d1_databases]]
binding = "DB"
database_name = "leaf-garden-db"
database_id = "19d140cf-bb75-4242-a30c-7f3f40827fe1"
