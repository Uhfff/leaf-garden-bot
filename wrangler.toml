name = "leaf-garden-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Referral-lock records only ('referred:<chatId>') — low write volume,
# well within the free tier. User registration and stats moved to D1
# below after KV's 1,000-writes/day free limit got hit by continuous
# stats reporting.
[[kv_namespaces]]
binding = "USERS"
id = "d480047ca477456fb148ac849f861f8e"

# User registration ('users' table) and per-player stats ('stats' table).
# D1's free tier write allowance is orders of magnitude past KV's.
[[d1_databases]]
binding = "DB"
database_name = "leaf-garden-db"
database_id = "19d140cf-bb75-4242-a30c-7f3f40827fe1"
